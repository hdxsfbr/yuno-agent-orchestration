<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evaluation report</title>
<style>
  :root { font-family: Inter, "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; color: #18181b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  main { width: 1440px; padding: 56px 120px 160px; font-size: 20px; line-height: 1.5; }
  h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -0.02em; }
  h2 { font-size: 28px; margin: 56px 0 14px; padding-top: 24px; border-top: 1px solid #e4e4e7; letter-spacing: -0.01em; }
  p { margin: 10px 0; color: #3f3f46; }
  ul { margin: 10px 0 10px 24px; padding: 0; color: #3f3f46; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; margin: 12px 0 8px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e4e4e7; vertical-align: top; }
  th { background: #fafafa; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #71717a; font-weight: 600; }
  tr:hover td { background: #fafafa; }
  a { color: inherit; text-decoration: none; }
  code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; background: #f4f4f5; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main id="report"></main>
<script src="vendor/marked.min.js"></script>
<script>
  // The recorder injects the report's markdown text as window.__REPORT_MD__ before this page loads.
  document.getElementById("report").innerHTML = marked.parse(window.__REPORT_MD__ || "", { gfm: true });
</script>
</body>
</html>
