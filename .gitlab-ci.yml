# GitLab CI for the Yuno stack (docs/deploy.md).
#
# test    runs the Go and web suites and lint (what docs/test-results.md records) against
#         postgres alone, on a shell runner tagged yuno-ci that has Docker with compose v2:
#         the unit tests use a fake gateway, so the OpenClaw gateway, the sandbox images and
#         the smoke test are not part of it (deploy runs `make smoke` on the droplet). The
#         Go module and build caches are named volumes kept between jobs. The tool
#         containers bind-mount the checkout, so a docker-in-docker executor cannot run
#         them; the runner must be a host with Docker.
# deploy  updates the public host from the shell runner installed on it (tag yuno-prod,
#         scripts/deploy/install-runner.sh): by hand from the pipeline page once test is
#         green, or automatically on main when the project variable DEPLOY_AUTO is "true".
#         It fetches the commit with the job token, so the host holds no GitLab credential.
#
# Pipelines are created only when the project variable YUNO_CI is "true", so a project with
# no runners shows no pending pipelines. The test job exists only while YUNO_CI_TEST is
# "true" (a yuno-ci runner is registered); until then deploy runs without it and the
# pipeline says so in its name.
stages: [test, deploy]

workflow:
  rules:
    - if: '$YUNO_CI == "true" && $YUNO_CI_TEST == "true"'
    - if: '$YUNO_CI == "true"'
      variables:
        PIPELINE_NOTE: "no test runner registered: tests were run by hand (docs/test-results.md)"
  name: '$CI_COMMIT_SHORT_SHA $PIPELINE_NOTE'

test:
  stage: test
  tags: [yuno-ci]
  rules:
    - if: '$YUNO_CI_TEST == "true"'
  variables:
    GIT_DEPTH: "20"
    # Keep the package caches between jobs; everything else is cleaned by git.
    GIT_CLEAN_FLAGS: -ffdx -e web/.pnpm-store -e web/node_modules
  script:
    # The example env: no provider key (the scripted model serves the tests), Telegram off.
    - cp .env.example .env
    - make ci-up
    - make ci-test
    - make ci-lint
  after_script:
    # The containers and the data volumes go; the Go module and build caches stay, so the
    # next job compiles only what changed.
    - make ci-clean || true

deploy:
  stage: deploy
  tags: [yuno-prod]
  needs:
    - job: test
      optional: true
  variables:
    GIT_STRATEGY: none
    DEPLOY_DIR: /home/yuno/yuno-agent-orchestration
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DEPLOY_AUTO == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    url: https://$DOMAIN
  resource_group: production
  script:
    - cd "$DEPLOY_DIR"
    - git fetch -q "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$CI_COMMIT_SHA"
    - git clean -q -fd
    - git checkout -q -B deploy FETCH_HEAD
    # Build first, then wait until no run is mid-step, then replace the containers: a run
    # parked on an approval can resume during the build, and a restart under a working
    # agent loses its step (scripts/deploy/wait-idle.sh).
    - make build-public
    - scripts/deploy/wait-idle.sh 1800 || true
    - make run-public
    - make smoke
