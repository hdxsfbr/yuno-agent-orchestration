name: yuno

# Topology (docs/DESIGN.md section 8):
#   openclaw      the agent runtime (gateway). Gets the Docker socket to create sibling
#                 sandbox containers, and host bind mounts because named volumes cannot be
#                 re-mounted into siblings.
#   api           the Go control plane. Shares the gateway's network namespace so it talks
#                 to the gateway over loopback as a trusted backend client, and so OpenClaw
#                 reaches the model proxy and MCP server on 127.0.0.1:8080.
#   web           nginx: static UI, proxies /api and friends to openclaw:8080 (where the
#                 api listens) and /telegram-webhook to the gateway.

x-api-env: &api-env
  DATABASE_URL: postgres://yuno:yuno@postgres:5432/yuno?sslmode=disable
  DEPLOYTARGET_URL: http://deploytarget:8091
  OPENCLAW_GATEWAY_URL: ws://127.0.0.1:18789
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env (make run generates one)}
  OPENCLAW_STATE_DIR: /home/node/.openclaw
  YUNO_MCP_TOKEN: ${YUNO_MCP_TOKEN:?set YUNO_MCP_TOKEN in .env (make run generates one)}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  WEB_PORT: ${WEB_PORT:-8080}
  MODEL_UPSTREAM: ${MODEL_UPSTREAM:-anthropic}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-opus-5-5}
  MODEL_PROXY_RATE_PER_MINUTE: ${MODEL_PROXY_RATE_PER_MINUTE:-60}
  MCP_TOOL_WAIT_SECONDS: ${MCP_TOOL_WAIT_SECONDS:-540}
  SCHEDULER_TICK: ${SCHEDULER_TICK:-10s}
  BUDGET_TICK: ${BUDGET_TICK:-60s}
  MERGE_REQUEST_SYNC_INTERVAL: ${MERGE_REQUEST_SYNC_INTERVAL:-120s}
  INTAKE_POLL_INTERVAL: ${INTAKE_POLL_INTERVAL:-120s}
  WAVE_WATCH_INTERVAL: ${WAVE_WATCH_INTERVAL:-60s}
  TELEGRAM_MODE: ${TELEGRAM_MODE:-off}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
  GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
  GITLAB_PROJECT_ID: ${GITLAB_PROJECT_ID:-}
  GITLAB_TOKEN: ${GITLAB_TOKEN:-}
  PROJECT_REPO_URL: ${PROJECT_REPO_URL:-}
  PROJECT_GIT_TOKEN: ${PROJECT_GIT_TOKEN:-}
  PROJECT_DEFAULT_BRANCH: ${PROJECT_DEFAULT_BRANCH:-main}
  PROJECT_PROVIDER: ${PROJECT_PROVIDER:-}
  PROJECT_SANDBOX_NETWORK: ${PROJECT_SANDBOX_NETWORK:-false}
  PROJECT_TOKEN_KEY: ${PROJECT_TOKEN_KEY:-}
  API_TOKEN: ${API_TOKEN:-}
  ENGINE_WORKERS: ${ENGINE_WORKERS:-4}
  HTTP_FETCH_ALLOWLIST: ${HTTP_FETCH_ALLOWLIST:-docs.python.org,pypi.org,raw.githubusercontent.com}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Everything else internal/config reads, with its defaults, so a value set in .env
  # reaches the api (internal/config/config_test.go keeps this list complete). The
  # addresses above that are written out are the compose topology, not settings.
  LISTEN_ADDR: ${LISTEN_ADDR:-:8080}
  OPENCLAW_SANDBOX_IMAGE: ${OPENCLAW_SANDBOX_IMAGE:-yuno-sandbox:latest}
  API_BASE_FOR_OPENCLAW: ${API_BASE_FOR_OPENCLAW:-http://127.0.0.1:8080}
  DEPLOYTARGET_LISTEN: ${DEPLOYTARGET_LISTEN:-:8091}
  DEPLOYTARGET_DATA_DIR: ${DEPLOYTARGET_DATA_DIR:-/tmp/yuno-releases}
  DEPLOYTARGET_MAX_MB: ${DEPLOYTARGET_MAX_MB:-100}
  ENGINE_STALE_AFTER: ${ENGINE_STALE_AFTER:-300s}
  MODEL_STALL_AFTER: ${MODEL_STALL_AFTER:-10m}
  TOOL_OUTPUT_MAX_BYTES: ${TOOL_OUTPUT_MAX_BYTES:-32768}
  ARTIFACT_DIR: ${ARTIFACT_DIR:-/data/artifacts}
  ARTIFACT_TTL_DAYS: ${ARTIFACT_TTL_DAYS:-30}
  SKILL_IMPORT_HOSTS: ${SKILL_IMPORT_HOSTS:-github.com,gitlab.com}
  MAX_STEPS: ${MAX_STEPS:-400}
  MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-10800}
  MAX_NODE_ITERATIONS: ${MAX_NODE_ITERATIONS:-120}
  MAX_LOOP_VISITS: ${MAX_LOOP_VISITS:-10}
  MAX_COST_USD: ${MAX_COST_USD:-20}
  MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-1000}
  APPROVAL_TIMEOUT_MAX_SECONDS: ${APPROVAL_TIMEOUT_MAX_SECONDS:-604800}
  EVAL_API_URL: ${EVAL_API_URL:-http://127.0.0.1:8080}
  EVAL_PROVIDER: ${EVAL_PROVIDER:-scripted}
  EVAL_SPLIT: ${EVAL_SPLIT:-public}
  EVAL_CASES: ${EVAL_CASES:-}
  EVAL_CASES_DIR: ${EVAL_CASES_DIR:-evals/cases}
  EVAL_REPORTS_DIR: ${EVAL_REPORTS_DIR:-evals/reports}
  # The one http host a project's repository URL may name (DESIGN 5.29 rule 17): the fake
  # forge of the eval profile. Empty outside make eval, where only https is accepted.
  EVAL_FORGE_URL: ${EVAL_FORGE_URL:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yuno
      POSTGRES_PASSWORD: yuno
      POSTGRES_DB: yuno
    # Published on the loopback interface only: the database has a fixed password and no
    # business on the network (make test and psql from the host still reach it).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuno -d yuno"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Writes the baseline openclaw.json (DESIGN 5.14 rule 3) into the bind-mounted state
  # directory, preserving anything the platform does not own. Runs to completion.
  openclaw-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: &version-arg
        VERSION: ${VERSION:-dev}
    command: ["openclaw-init"]
    environment:
      <<: *api-env
    volumes:
      - ./data/openclaw:/home/node/.openclaw
    restart: "no"

  openclaw:
    # Upstream image pinned in docker/openclaw.Dockerfile, plus the docker CLI the
    # gateway uses to inspect itself and create sibling sandboxes.
    build:
      context: .
      dockerfile: docker/openclaw.Dockerfile
    image: yuno-openclaw-gateway:2026.10.3
    container_name: yuno-openclaw
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    environment:
      NODE_OPTIONS: "--max-old-space-size=3072"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_SANDBOX: "1"
      OPENCLAW_DOCKER_SOCKET: /var/run/docker.sock
      OPENCLAW_CONTAINER_HINT: yuno-openclaw
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      YUNO_MCP_TOKEN: ${YUNO_MCP_TOKEN:?set YUNO_MCP_TOKEN in .env}
      TZ: UTC
    volumes:
      # Host bind mounts, not named volumes: the gateway passes these paths to sibling
      # sandbox containers through the host Docker daemon (DESIGN 5.14 rule 12).
      - ./data/openclaw:/home/node/.openclaw
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    # The socket is root:docker on the host; make run writes the group id into .env.
    group_add:
      - "${DOCKER_GID:-0}"
    expose:
      - "18789"
      - "8080"
    pids_limit: 1024
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: *version-arg
    command: ["api"]
    # Loopback trust with the gateway (DESIGN 5.14 rule 1). The api's port 8080 is
    # therefore reachable as openclaw:8080 from the compose network.
    network_mode: "service:openclaw"
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      # The first named volume the api mounts: the files runs deliver (DESIGN 5.25 rule 4),
      # kept until ARTIFACT_TTL_DAYS after the run finished, mounted where ARTIFACT_DIR says.
      # The image creates /data/artifacts owned by app, so the volume inherits it there; any
      # other directory needs to be writable by the app user (uid 1000).
      - artifacts:${ARTIFACT_DIR:-/data/artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_healthy
      deploytarget:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      # WEB_BIND=127.0.0.1 on a public host: Docker publishes ports past the host firewall.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # ---- public deployment (profile public, docs/deploy.md) ------------------------------
  # Caddy terminates TLS for DOMAIN with automatic certificates and proxies everything
  # (UI, /api, /telegram-webhook) to nginx. `make run-public` starts it; the profile is
  # activated on the public host with COMPOSE_PROFILES=public in .env.
  caddy:
    profiles: ["public"]
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  deploytarget:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: *version-arg
    command: ["deploytarget"]
    environment:
      DEPLOYTARGET_DATA_DIR: /data
    volumes:
      - releases:/data
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The fake forge the evals run against (DESIGN 5.29 rule 17): an in-memory GitLab REST
  # subset plus Git smart HTTP. Eval profile only, so make run never starts it; no published
  # port, reachable as http://forgefake:8090 on the compose network. The token is a fixed
  # eval value, not a secret.
  forgefake:
    profiles: ["eval"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: *version-arg
    command: ["forgefake"]
    environment:
      FORGEFAKE_TOKEN: ${FORGEFAKE_TOKEN:-forgefake-eval-token}
      FORGEFAKE_ADDR: ":8090"
    expose:
      - "8090"
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Build-only: produces the image OpenClaw uses for agent sandboxes. Never runs.
  sandbox-image:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    image: yuno-sandbox:latest
    entrypoint: ["true"]
    profiles: ["build"]

  # Build-only: the per-toolchain sandbox images a project run selects by the
  # repository's manifest (DESIGN 5.16 rule 6). Never run.
  sandbox-image-python:
    build:
      context: .
      dockerfile: docker/sandbox-python.Dockerfile
    image: yuno-sandbox-python:latest
    entrypoint: ["true"]
    profiles: ["build"]
  sandbox-image-node:
    build:
      context: .
      dockerfile: docker/sandbox-node.Dockerfile
    image: yuno-sandbox-node:latest
    entrypoint: ["true"]
    profiles: ["build"]
  sandbox-image-go:
    build:
      context: .
      dockerfile: docker/sandbox-go.Dockerfile
    image: yuno-sandbox-go:latest
    entrypoint: ["true"]
    profiles: ["build"]

  # ---- tooling (profiles) ------------------------------------------------

  go:
    profiles: ["tools"]
    # golang:1.26-alpine plus git (docker/go.Dockerfile); compose builds it on first use.
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    image: yuno-go-tools:1.26
    working_dir: /src
    # Shares the gateway namespace so integration tests reach it over loopback.
    network_mode: "service:openclaw"
    environment:
      <<: *api-env
      DATABASE_URL: postgres://yuno:yuno@postgres:5432/yuno_test?sslmode=disable
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: "0"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - ./data/openclaw:/home/node/.openclaw
    depends_on:
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_healthy

  # The Go tool container of CI's test job (Makefile ci-test, ci-lint): the same image,
  # caches and environment as `go`, on the project network with postgres as its only
  # dependency. The unit tests talk to a fake gateway and the integration tests
  # (test-integration) are not run in CI, so the gateway, which `go` shares its network
  # namespace with, is not started there.
  go-ci:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    image: yuno-go-tools:1.26
    working_dir: /src
    environment:
      <<: *api-env
      DATABASE_URL: postgres://yuno:yuno@postgres:5432/yuno_test?sslmode=disable
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: "0"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  node:
    profiles: ["tools"]
    image: node:24-slim
    working_dir: /app
    # Runs as the host user so files it writes into ./web are not root-owned. pnpm keeps
    # its store in ./web/.pnpm-store (same filesystem, git-ignored).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./web:/app
    entrypoint: ["sh", "-c", "mkdir -p /tmp/corepack-bin /tmp/corepack && corepack enable --install-directory /tmp/corepack-bin && export PATH=/tmp/corepack-bin:$$PATH && exec \"$$@\"", "--"]

  # Integration canary for the OpenClaw contract (scripts/openclaw-probe.mjs).
  probe:
    profiles: ["tools"]
    image: node:24-slim
    network_mode: "service:openclaw"
    working_dir: /scripts
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      openclaw:
        condition: service_healthy
    entrypoint: ["node", "/scripts/openclaw-probe.mjs"]

  eval:
    profiles: ["eval"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: *version-arg
    command: ["eval"]
    network_mode: "service:openclaw"
    environment:
      <<: *api-env
      EVAL_PROVIDER: ${EVAL_PROVIDER:-scripted}
      EVAL_SPLIT: ${EVAL_SPLIT:-public}
      FORGEFAKE_TOKEN: ${FORGEFAKE_TOKEN:-forgefake-eval-token}
      LISTEN_ADDR: ":8081"
    volumes:
      - ./evals:/src/evals
      - ./data/openclaw:/home/node/.openclaw
    depends_on:
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_healthy
      deploytarget:
        condition: service_healthy

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.1
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:8081"]
    depends_on:
      - web

  # Demo recorder (scripts/demo/README.md): drives the UI in a real browser, one WebM per scene.
  # It joins the default network and reaches the UI as http://web:80. API_TOKEN comes from .env
  # through the environment and is attached to API requests by the browser; it is not written
  # anywhere. PROJECT_REPO_URL and PROJECT_GIT_TOKEN (the api's bootstrap inputs) are the project
  # the dev-pipeline scene registers; the token is only typed into the page's password field.
  # Run it with `make demo-record` (--no-deps: it never touches the running stack).
  demo:
    profiles: ["tools"]
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /demo
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    ipc: host
    entrypoint: ["sh", "/demo/entrypoint.sh"]
    environment:
      HOME: /tmp
      PW_DIR: /demo/.pw
      FONTCONFIG_FILE: /demo/fonts.conf
      OUT_DIR: /out
      BASE_URL: ${DEMO_BASE_URL:-http://web:80}
      API_TOKEN: ${API_TOKEN:-}
      SCENES: ${SCENES:-}
      LIVE: ${LIVE:-}
      COMMIT: ${DEMO_COMMIT:-}
      REPO_URL: ${DEMO_REPO_URL:-}
      RUN_ID: ${DEMO_RUN_ID:-}
      PACE: ${DEMO_PACE:-}
      NEW_COPY: ${DEMO_NEW_COPY:-}
      MASK_IDS: ${DEMO_MASK_IDS:-}
      PIPELINE_TASK: ${DEMO_PIPELINE_TASK:-}
      PIPELINE_TEMPLATE: ${DEMO_PIPELINE_TEMPLATE:-}
      PIPELINE_WORKFLOW: ${DEMO_PIPELINE_WORKFLOW:-}
      PROJECT_REPO_URL: ${PROJECT_REPO_URL:-}
      PROJECT_GIT_TOKEN: ${PROJECT_GIT_TOKEN:-}
      PROJECT_DEFAULT_BRANCH: ${PROJECT_DEFAULT_BRANCH:-}
      PROJECT_NAME: ${DEMO_PROJECT_NAME:-}
      PROJECT_DESCRIPTION: ${DEMO_PROJECT_DESCRIPTION:-}
      SCHEDULE_WORKFLOW: ${DEMO_SCHEDULE_WORKFLOW:-}
      STEP_LIMIT_TASK: ${DEMO_STEP_LIMIT_TASK:-}
      REJECT_TASK: ${DEMO_REJECT_TASK:-}
      SCHEDULE_TOPIC: ${DEMO_SCHEDULE_TOPIC:-}
      EVAL_CONSOLE: ${DEMO_EVAL_CONSOLE:-}
      RUN_TIMEOUT_MS: ${DEMO_RUN_TIMEOUT_MS:-}
      PHONE_TIMEOUT_MS: ${DEMO_PHONE_TIMEOUT_MS:-}
      PANEL_RUN_ID: ${DEMO_PANEL_RUN_ID:-}
      PANEL_TASK: ${DEMO_PANEL_TASK:-}
      PANEL_PROJECT: ${DEMO_PANEL_PROJECT:-}
      PANEL_WORKFLOW: ${DEMO_PANEL_WORKFLOW:-}
      PANEL_TEMPLATE: ${DEMO_PANEL_TEMPLATE:-}
    volumes:
      - ./scripts/demo:/demo
      - ./scripts/demo/out:/out
      - ./evals/reports:/reports:ro

  # Architecture diagrams: oh-my-mermaid CLI and viewer over .omm/ (profile tools).
  # scripts/omm.sh wraps `docker compose run omm`; `make omm-view` serves the viewer on :${OMM_PORT:-3030} (3000 is often taken by a dev server).
  omm:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/omm.Dockerfile
    image: yuno-omm
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "${OMM_PORT:-3030}:3000"

volumes:
  pgdata: {}
  releases: {}
  artifacts: {}
  gomod: {}
  gocache: {}
  caddy_data: {}
  caddy_config: {}
