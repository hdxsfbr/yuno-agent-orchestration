openapi: 3.1.0
info:
  title: Yuno Agent Orchestration API
  version: 0.8.0
  description: |
    Control plane for configurable AI agents and multi-agent workflows executed on
    OpenClaw. All endpoints are JSON. When API_TOKEN is set, every /api path except
    /api/openapi.yaml requires `Authorization: Bearer <token>`. Errors always use the
    Error schema. `/mcp` (Model Context Protocol, streamable HTTP) and `/model-proxy/*`
    (model provider proxy) are machine endpoints for the OpenClaw gateway and are not
    described here beyond their existence.
servers:
  - url: /
# Every /api operation carries the bearer scheme (optional while API_TOKEN is unset);
# health, readiness and this document are open. See components.securitySchemes.
security:
  - bearerAuth: []
tags:
  - name: ops
  - name: agents
  - name: runs
  - name: tools
  - name: approvals
  - name: workflows
  - name: schedules
  - name: skills
  - name: memory
  - name: channels
  - name: projects
  - name: merge-requests
paths:
  /healthz:
    get:
      tags: [ops]
      summary: Process liveness
      security: []
      responses:
        "200": { description: ok, content: { text/plain: { schema: { type: string } } } }
  /readyz:
    get:
      tags: [ops]
      summary: Readiness (database reachable, gateway connected and scoped)
      security: []
      responses:
        "200": { description: ready, content: { text/plain: { schema: { type: string } } } }
        "503": { $ref: "#/components/responses/Error" }
  /openapi.yaml:
    get:
      tags: [ops]
      summary: This document
      security: []
      responses:
        "200": { description: OpenAPI document, content: { application/yaml: { schema: { type: string } } } }
  /api/status:
    get:
      tags: [ops]
      summary: Platform status (500 ms server-side budget)
      responses:
        "200":
          description: status
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
  /api/openclaw/status:
    get:
      tags: [ops]
      summary: Gateway connection state
      responses:
        "200":
          description: gateway status
          content: { application/json: { schema: { $ref: "#/components/schemas/OpenClawStatus" } } }
  /api/events:
    get:
      tags: [ops]
      summary: Server-sent events for every run
      description: |
        `text/event-stream`. Each event has `id` (durable sequence), `event` (type) and JSON
        `data`. Send `Last-Event-ID` to replay missed events. A comment line is sent every
        15 seconds as a heartbeat. Event types: run.status, node.status, model_call,
        tool_call, approval.requested, approval.decided, agent_message, log,
        run.retry (`{retries, from_node, by, limits, at}`: an operator retried the run from
        the step it stopped at),
        run.artifacts (`{run_id, count}`: the files a step delivered were collected, DESIGN
        5.25),
        branch.status (`{branch}`: a RunBranch of a fork visit changed, DESIGN 5.26),
        schedule.fired (`{schedule, run}`, filed under the run it created),
        conversation.message (`{conversation, message}`: a Conversation and a
        ConversationMessage, platform-wide, no run), and conversation.tool_call
        (`{conversation_id, tool_call}`: a ToolCall an agent made while chatting, with its
        chat token; platform-wide, no run; `conversation_id` is null when the agent had no
        conversation). An approval raised in a conversation has no run; its
        approval.requested and approval.decided carry `conversation_id`.
      responses:
        "200": { description: event stream, content: { text/event-stream: { schema: { type: string } } } }
  /api/runs/{id}/events:
    get:
      tags: [ops]
      summary: Server-sent events for one run
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: event stream, content: { text/event-stream: { schema: { type: string } } } }

  /api/agents:
    get:
      tags: [agents]
      summary: List agents
      responses:
        "200":
          description: agents
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentListItem" } } } }
    post:
      tags: [agents]
      summary: Create an agent and materialise it in OpenClaw
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentInput" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/agents/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [agents]
      summary: Get an agent
      responses:
        "200": { description: agent, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [agents]
      summary: Replace an agent's configuration and re-materialise it
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentInput" } } }
      responses:
        "200": { description: agent, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      tags: [agents]
      summary: Soft-delete an agent (existing runs keep their snapshot)
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/agents/{id}/materialize:
    post:
      tags: [agents]
      summary: Push the agent's configuration to OpenClaw now
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: runtime view, content: { application/json: { schema: { $ref: "#/components/schemas/AgentRuntime" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/agents/{id}/runtime:
    get:
      tags: [agents]
      summary: What OpenClaw currently holds for this agent
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: runtime view, content: { application/json: { schema: { $ref: "#/components/schemas/AgentRuntime" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/agents/{id}/memory:
    get:
      tags: [memory]
      summary: The agent's remembered facts, newest first
      description: |
        Facts the agent saved with memory_save that have not expired; an expired fact is
        left out even before the sweep deletes it.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200":
          description: facts
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MemoryFact" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/agents/{id}/memory/{factId}:
    delete:
      tags: [memory]
      summary: Forget one fact
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: factId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }

  /api/tools:
    get:
      tags: [tools]
      summary: Tool registry (platform tools over MCP and the OpenClaw built-ins templates use)
      responses:
        "200":
          description: tools
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Tool" } } } }

  /api/runs:
    get:
      tags: [runs]
      summary: List runs, newest first
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: project_id, in: query, description: "only the runs that work on this project (runs.project_id, kept by a deleted project's runs); an unknown id lists none", schema: { type: string } }
        - { name: trigger, in: query, description: "DESIGN 5.23 rule 8: only the runs started this way; another value is 422", schema: { type: string, enum: [manual, schedule, channel, eval, issue] } }
        - { name: merge_request_id, in: query, description: "DESIGN 5.22 rule 11: only the runs that named this merge request record (runs.merge_request_id); an unknown id lists none", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: runs
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Run" } } } }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [runs]
      summary: Trigger a run (manual trigger)
      description: |
        Either `workflow_id` with `input`, or `agent_id` with `task` for a one-node
        "quick run" that wraps the agent in a single-agent workflow. The run's
        `max_cost_usd` is the smallest of the requested or workflow limit and every
        participating agent's `guardrails.max_cost_usd_per_run`. When an agent in the
        run already has `guardrails.max_runs_per_hour` runs created in the last hour the
        answer is 429 with code `rate_limited` and the message
        `rate limit: <n> runs/hour for agent <name>`. When `project_id` names a project
        whose spend in the current UTC day or month has reached its cap (DESIGN 5.19) the
        answer is also 429, with code `project_budget_reached`, the message `project
        <name> has reached its <daily|monthly> budget ($<cap>); new runs are refused
        until <time>` and `details` `{project_id, window, max_cost_usd, spent_usd,
        until}`. DESIGN 5.22 rule 1: `merge_request_id` names the
        open merge request record of the run's project whose branch the run works on;
        it is refused with a 422 detail on `merge_request_id` when the workflow uses no
        project, the id is unknown, the record belongs to another project, the request
        is merged or closed, or a live run (the one that opened it included) is updating
        it (`... is being updated by run <id>`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RunCreate" } } }
      responses:
        "201": { description: queued, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/runs/{id}:
    get:
      tags: [runs]
      summary: Get a run
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/runs/{id}/cancel:
    post:
      tags: [runs]
      summary: Request cancellation
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "202": { description: cancel requested, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/runs/{id}/retry:
    post:
      tags: [runs]
      summary: Retry a failed, timed-out or cancelled run from the step it stopped at
      description: |
        DESIGN 5.21. Re-queues the run from its current node, keeping its
        state, counters and checkout; `retries` counts it. The optional `limits` replace the run's
        limits first, which is how a run that died on a cap is retried.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/RunRetry" } } }
      responses:
        "202": { description: re-queued, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "run_not_retryable, retry_limit or limits_exhausted (details name each exhausted limit: max_steps, max_tool_calls, max_cost_usd, and max_loop_visits for the node the run resumes at)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "429": { description: "project_budget_reached (DESIGN 5.19)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/runs/{id}/trace:
    get:
      tags: [runs]
      summary: Correlated trace (nodes, model calls, tool calls, spans, agent messages, approvals, side effects)
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: trace, content: { application/json: { schema: { $ref: "#/components/schemas/Trace" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/runs/{id}/artifacts:
    get:
      tags: [runs]
      summary: The files the run delivered, by path
      description: |
        DESIGN 5.25. Files an agent put under `runs/<run id>/out/`,
        collected at the end of every step, one entry per path (the newest version), plus
        `diff.patch` for a project run whose checkout changed. Empty for a run that delivered
        nothing; artifacts are deleted `ARTIFACT_TTL_DAYS` after the run finished.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: artifacts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Artifact" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/runs/{id}/artifacts/{artifactId}:
    get:
      tags: [runs]
      summary: Download one artifact
      description: |
        DESIGN 5.25 rule 5. The file's bytes with its content type
        (`text/plain` for HTML and SVG), `Content-Disposition: attachment; filename="<base
        name>"`, `X-Content-Type-Options: nosniff` and `Cache-Control: private, no-store`;
        never rendered inline. 404 when the artifact is not this run's or its file is gone.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: artifactId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: the file, content: { "*/*": { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/approvals:
    get:
      tags: [approvals]
      summary: Approvals inbox, newest first, each with the tool call it gates
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, expired] } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: approvals
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApprovalItem" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/approvals/{id}/approve:
    post:
      tags: [approvals]
      summary: Approve a pending approval
      description: |
        `always` (exec approvals only) also adds the command to the agent's exec allowlist.
        A tool approval decided while the agent's tool call still waits returns the result
        to the agent in the same turn; after that, the platform executes the side effect
        itself under the same idempotency key.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalDecision" } } }
      responses:
        "200": { description: decided, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/approvals/{id}/reject:
    post:
      tags: [approvals]
      summary: Reject a pending approval (for a question, decline to answer it)
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/RejectDecision" } } }
      responses:
        "200": { description: decided, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/approvals/{id}/answer:
    post:
      tags: [approvals]
      summary: Answer a pending question
      description: |
        DESIGN 5.24 rule 3. The approval must be of kind `question`
        (422 `answer: only a question can be answered` otherwise) and pending (409
        `not_pending`). The row becomes `approved` with `answer`. An answer that arrives while
        the agent's tool call still waits is returned to the agent in the same turn; after
        that it continues the step, in the same turn when the agent is still working, else
        as a new visit of the step with the answer in its task. `approve` on a question is
        422 `answer: a question needs an answer`.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnswerBody" } } }
      responses:
        "200": { description: answered, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/workflows:
    get:
      tags: [workflows]
      summary: List the operator's workflows (templates are listed under /api/workflow-templates)
      responses:
        "200":
          description: workflows
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Workflow" } } } }
    post:
      tags: [workflows]
      summary: Create a workflow (validated as /api/workflows/validate does)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowInput" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/workflows/validate:
    post:
      tags: [workflows]
      summary: Validate a definition without saving it
      description: |
        422 details carry one entry per problem, with paths relative to the definition
        (`nodes[1].task`, `edges[2].to`, `nodes[0].agent_id`, `input_schema`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidateRequest" } } }
      responses:
        "200": { description: valid, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidation" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/workflows/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [workflows]
      summary: Get a workflow
      responses:
        "200": { description: workflow, content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [workflows]
      summary: Replace a workflow; the version goes up by one (runs keep the version they started with)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowInput" } } }
      responses:
        "200": { description: workflow, content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [workflows]
      summary: Soft-delete a workflow (existing runs keep their snapshot)
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/workflow-templates:
    get:
      tags: [workflows]
      summary: Workflow templates loaded from templates/*.json at start
      responses:
        "200":
          description: templates
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowTemplate" } } } }
  /api/workflow-templates/{key}/instantiate:
    post:
      tags: [workflows]
      summary: Copy a template into a new editable workflow
      description: |
        Every agent node's `agent_name` is resolved, case-insensitively, to the id of the
        agent with that name (the oldest when several share it). A missing agent is a 422
        with `nodes[i].agent_name: no agent named 'X'`.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/InstantiateRequest" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/evals/scripts:
    post:
      tags: [runs]
      summary: Register a script for the deterministic scripted provider
      description: Used by the eval runner and tests. Replaces any script with the same id.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScriptRegistration" } } }
      responses:
        "204": { description: registered }
        "422": { $ref: "#/components/responses/Error" }

  /api/schedules:
    get:
      tags: [schedules]
      summary: List schedules, oldest first
      responses:
        "200":
          description: schedules
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Schedule" } } } }
    post:
      tags: [schedules]
      summary: Create a schedule
      description: |
        A `cron` schedule fires on a standard 5-field expression read in `tz`; a `delay`
        schedule fires once at `run_at` and then disables itself. `next_run_at` is
        computed from now. 422 details: `cron_expr` and `tz` carry the parser's message
        (`cron_expr: no future occurrence` for an expression that names no date to come,
        such as `0 0 31 2 *`), `input.<field>` the workflow's input schema violations.
        DESIGN 5.22 rule 7: `merge_request_id` carries the same
        details as a run request's (DESIGN 5.22 rule 1) and needs `project_id`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleInput" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/schedules/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [schedules]
      summary: Get a schedule
      responses:
        "200": { description: schedule, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [schedules]
      summary: Change a schedule; fields left out keep their value (`{"enabled":false}` pauses it)
      description: next_run_at is recomputed from now and last_error is cleared.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleInput" } } }
      responses:
        "200": { description: schedule, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [schedules]
      summary: Delete a schedule (runs it created are kept)
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }

  /api/channels:
    get:
      tags: [channels]
      summary: Channels the platform binds agents to, with the Telegram binding
      responses:
        "200": { description: channels, content: { application/json: { schema: { $ref: "#/components/schemas/Channels" } } } }
  /api/channels/telegram/binding:
    put:
      tags: [channels]
      summary: Bind an agent to Telegram (one agent at a time)
      description: |
        The binding is stored, then applied to the gateway (a config patch and, when
        something changed, a gateway restart). 409 `channel_bound` while another agent is
        bound, with `details: {agent_id, agent_name}`. 502 `gateway_error` when the
        gateway refused the change: the binding is kept (`details: {binding_id}`) and
        applied again when the api reconnects.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChannelBindingInput" } } }
      responses:
        "200": { description: bound, content: { application/json: { schema: { $ref: "#/components/schemas/Channels" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [channels]
      summary: Unbind Telegram and close it to direct messages
      responses:
        "200": { description: unbound, content: { application/json: { schema: { $ref: "#/components/schemas/Channels" } } } }
        "502": { $ref: "#/components/responses/Error" }
  /api/conversations:
    get:
      tags: [channels]
      summary: Conversations mirrored from the bound agent's channel sessions, most recently active first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: conversations
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Conversation" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/conversations/{id}/messages:
    get:
      tags: [channels]
      summary: A conversation's newest messages, oldest first
      description: |
        What the person sent (`in`) and what the agent answered (`out`), text only.
        Messages older than the agent's `memory_policy.conversation_ttl_days` (7 by
        default) are left out even before the retention sweep deletes them.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: limit, in: query, schema: { type: integer, default: 500, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: messages
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConversationMessage" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/conversations/{id}/tool-calls:
    get:
      tags: [channels]
      summary: The platform tool calls the conversation's agent made while chatting, oldest first
      description: |
        Calls made with the agent's chat token (DESIGN 5.15): `list_agents`,
        `list_workflows`, `delegate_task`, `run_status`, `memory_save` and
        `memory_recall`, recorded against the agent's most recent conversation. They
        have no run (`run_id` and `run_node_id` are empty); the input is redacted, the
        chat token included. The newest `limit` calls are returned.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: limit, in: query, schema: { type: integer, default: 500, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: tool calls
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ToolCall" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/skills:
    get:
      tags: [skills]
      summary: List skills by name
      responses:
        "200":
          description: skills
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Skill" } } } }
    post:
      tags: [skills]
      summary: Create a skill
      description: Agents list skills by name; each listed skill is written to the agent's workspace as skills/<name>/SKILL.md.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillInput" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/skills/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [skills]
      summary: Get a skill
      responses:
        "200": { description: skill, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [skills]
      summary: Replace a skill and re-materialise the agents that use it
      description: |
        A rename is carried into every agent's `skills` list. When an agent could not be
        pushed to OpenClaw the change is still saved and the answer is 502 with
        `details: {id, agent_ids}`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillInput" } } }
      responses:
        "200": { description: skill, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      tags: [skills]
      summary: Delete a skill, remove it from every agent and re-materialise them
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/projects:
    get:
      tags: [projects]
      summary: List projects by name, each with its newest run
      description: The git token is never returned; `token_set` says one is stored.
      responses:
        "200":
          description: projects
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Project" } } } }
    post:
      tags: [projects]
      summary: Create a project
      description: |
        A project is a git repository runs work on (DESIGN 5.17): an https clone URL without
        credentials, the provider (inferred from the host when left empty), the default branch
        and a git token with write access, stored encrypted under PROJECT_TOKEN_KEY and never
        returned. `token` is required here. Without PROJECT_TOKEN_KEY the api answers 503.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectInput" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/projects/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [projects]
      summary: Get a project
      responses:
        "200": { description: project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [projects]
      summary: Replace a project's settings
      description: A missing or empty `token` keeps the stored one; a new one replaces it. Runs in flight read the token when they clone or push, so a replacement applies to them.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectInput" } } }
      responses:
        "200": { description: project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      summary: Delete a project
      description: A soft delete; runs that name the project keep their snapshot of its settings, and a run in flight still clones and pushes.
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/projects/{id}/check:
    post:
      tags: [projects]
      summary: Verify the stored token against the provider, without a clone
      description: |
        Lists the repository through the provider's API with the stored token and reports its
        default branch, whether the project's default branch exists and whether the token can
        push to it. Provider refusals and errors are results (`ok: false` with the message), not
        HTTP errors.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: result, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCheck" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/projects/{id}/intake/poll:
    post:
      tags: [projects]
      summary: Poll the project's issue intake now
      description: |
        DESIGN 5.23 rule 2. Runs one intake pass for the project at
        once: lists the open issues carrying the intake label, creates a run for each one
        not yet taken (at most 10), swaps the label and comments, then posts the outcome of
        the project's finished issue runs on their issues. Provider errors are results
        (`error`, also recorded as the project's `intake.last_error`), not HTTP errors.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: what the pass did, content: { application/json: { schema: { $ref: "#/components/schemas/IntakePollResult" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "intake_disabled: the project's intake is off", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/projects/{id}/facts:
    get:
      tags: [projects]
      summary: The project's live notes, newest first
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: notes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectFact" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/projects/{id}/facts/{factId}:
    delete:
      tags: [projects]
      summary: Delete a project note
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: factId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/merge-requests:
    get:
      tags: [merge-requests]
      summary: Merge requests the platform opened, newest first
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [open, merged, closed] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MergeRequest" } } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/merge-requests/{id}:
    get:
      tags: [merge-requests]
      summary: One merge request record
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: record, content: { application/json: { schema: { $ref: "#/components/schemas/MergeRequest" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/merge-requests/{id}/sync:
    post:
      tags: [merge-requests]
      summary: Refresh the record from the provider now
      description: DESIGN 5.20 rule 3. Provider errors are recorded on the record (`last_sync_error`), not HTTP errors.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: refreshed record, content: { application/json: { schema: { $ref: "#/components/schemas/MergeRequest" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/merge-requests/{id}/merge:
    post:
      tags: [merge-requests]
      summary: Merge the request on the provider
      description: |
        DESIGN 5.20 rule 5. Needs state `open` and a pipeline that passed or
        does not exist. A provider refusal (conflicts, a protected branch, a required approval)
        answers 409 `merge_request_not_mergeable` with the provider's message.
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: merged record, content: { application/json: { schema: { $ref: "#/components/schemas/MergeRequest" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "merge_request_not_open, merge_request_ci_not_passed or merge_request_not_mergeable", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "provider_unavailable (the provider did not answer; the record was re-synced and is still open) or provider_error (the provider refused with another status)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <API_TOKEN>`. Required on every /api path (except
        /api/openapi.yaml, which serves this document) when the api runs with API_TOKEN set,
        and answered with 401 when missing or wrong. Optional when API_TOKEN is unset, the
        local default: requests without it are accepted.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Status:
      type: object
      required: [version, uptime_s, db_ok, workers, runs, sse_clients, scheduler]
      properties:
        version: { type: string }
        uptime_s: { type: integer }
        db_ok: { type: boolean }
        workers: { type: integer }
        sse_clients: { type: integer }
        runs: { type: object, additionalProperties: { type: integer } }
        scheduler:
          type: object
          required: [tick_seconds, next_due_at]
          properties:
            tick_seconds: { type: number, description: how often the scheduler looks for due schedules }
            next_due_at: { type: [string, "null"], format: date-time, description: "earliest next_run_at of the enabled schedules; null when none is enabled" }
    OpenClawStatus:
      type: object
      required: [connected, scopes]
      properties:
        connected: { type: boolean }
        version: { type: string }
        conn_id: { type: string }
        scopes: { type: array, items: { type: string } }
        agents: { type: integer, description: agents known to the gateway }
    Limits:
      type: object
      description: Zero or absent means the platform default; values are clamped to platform maximums at trigger time.
      properties:
        max_steps: { type: integer }
        max_duration_seconds: { type: integer }
        max_node_iterations: { type: integer }
        max_loop_visits: { type: integer }
        max_cost_usd: { type: number }
        max_tool_calls: { type: integer }
        approval_timeout_seconds: { type: integer }
    Guardrails:
      type: object
      description: |
        Bounds on what the agent may spend and do (zero or absent means none). 422 paths
        are `guardrails.<field>` and `guardrails.blocked_input_patterns[i].<field>`; a
        regex that does not compile is refused with the parser's message.
      properties:
        max_cost_usd_per_run: { type: number, description: caps max_cost_usd of every run the agent takes part in }
        max_runs_per_hour: { type: integer, description: runs including this agent created in a rolling hour; more are refused with 429 }
        blocked_tools: { type: array, items: { type: string }, description: never offered to the agent and refused if called }
        blocked_input_patterns:
          type: array
          description: |
            RE2 expressions tested against the canonical JSON of a call's input (keys
            sorted, no spacing, run_token left out). A match refuses the call with
            "input blocked by guardrail <name>". Platform tools are checked on every call.
            With any exec pattern, every host exec command asks for approval (the exec
            allowlist is not applied) and a command a pattern matches is denied at once.
          items:
            type: object
            required: [name, tool, regex]
            properties:
              name: { type: string }
              tool: { type: string }
              regex: { type: string }
    MemoryPolicy:
      type: object
      properties:
        enabled: { type: boolean, description: off means the memory tools are not offered and MEMORY.md stays empty }
        max_facts: { type: integer, description: "default 200; past it the oldest fact by creation is dropped" }
        fact_ttl_days: { type: integer, description: default 30 }
        conversation_window: { type: integer }
        conversation_ttl_days: { type: integer }
    MemoryFact:
      type: object
      required: [id, scope, agent_id, key, value, created_at, updated_at]
      properties:
        id: { type: string }
        scope: { type: string, enum: [agent, conversation] }
        agent_id: { type: string }
        key: { type: string }
        value: { type: string }
        source_run_id: { type: string, description: the run that saved it last }
        created_at: { type: string, format: date-time, description: when the key was first saved }
        updated_at: { type: string, format: date-time, description: when the value was last saved }
        expires_at: { type: string, format: date-time }
    ScheduleInput:
      type: object
      properties:
        workflow_id: { type: string, description: required on create }
        project_id: { type: string, description: "The project the schedule's runs work on (DESIGN 5.9 rule 6), checked as a run's is (5.17 rule 4): required for a workflow whose definition has `project: true`, refused for one without it; an unknown or deleted id is refused. Left out on update it keeps its value, unless workflow_id changes, which drops it; an empty string clears it." }
        kind: { type: string, enum: [cron, delay], description: required on create }
        cron_expr: { type: string, description: "kind cron: 5 fields (minute hour day-of-month month day-of-week), e.g. 0 9 * * 1-5" }
        tz: { type: string, description: "IANA zone the expression is read in, default UTC" }
        run_at: { type: string, format: date-time, description: "kind delay: when it fires" }
        enabled: { type: boolean, description: default true }
        input: { type: object, description: "the run input, checked against the workflow's input schema" }
        merge_request_id: { type: string, description: "DESIGN 5.22 rule 7: the open merge request record of the schedule's project whose branch its runs work on; checked as a run request's merge_request_id is (5.22 rule 1). Left out on update it keeps its value, unless workflow_id or project_id changes, which drops it; an empty string clears it." }
    Schedule:
      type: object
      required: [id, workflow_id, workflow_name, kind, tz, enabled, input, created_at, updated_at]
      properties:
        id: { type: string }
        workflow_id: { type: string }
        workflow_name: { type: string }
        project_id: { type: string, description: "the project the schedule's runs work on; absent for a workflow without one" }
        project_name: { type: string, description: "the project's name as the API joined it; it survives the project's deletion" }
        merge_request_id: { type: string, description: "DESIGN 5.22 rule 7: the merge request record the schedule's runs update; absent when none" }
        merge_request_number: { type: integer, description: "the request's provider number as the API joined it; absent once the record is gone (the schedule then fires without a request)" }
        kind: { type: string, enum: [cron, delay] }
        cron_expr: { type: string }
        tz: { type: string }
        run_at: { type: string, format: date-time }
        enabled: { type: boolean }
        next_run_at: { type: string, format: date-time, description: absent while disabled }
        last_run_at: { type: string, format: date-time }
        last_run_id: { type: string }
        last_error: { type: string, description: "why the last firing created no run, e.g. workflow deleted" }
        input: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SkillInput:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 64 }
        description: { type: string, maxLength: 1024 }
        body: { type: string, description: "markdown instructions, at most 256 KiB" }
    Skill:
      type: object
      required: [id, name, description, body, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectSettings:
      type: object
      description: A project's settings without its token; also a run's snapshot of the project it works on.
      required: [name, repo_url, provider, default_branch, sandbox_network]
      properties:
        name: { type: string }
        repo_url: { type: string, description: "the https clone URL, without credentials" }
        provider: { type: string, enum: [gitlab, github] }
        default_branch: { type: string }
        sandbox_network: { type: boolean, description: runs on the project get a sandbox with network access }
    ProjectLastRun:
      type: object
      description: The newest run that names the project.
      required: [id, status, created_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, waiting_approval, succeeded, failed, cancelled, timed_out] }
        toolchain: { type: string, enum: [go, node, python, default] }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectSettings"
        - type: object
          required: [id, description, token_set, intake, created_at, updated_at]
          properties:
            id: { type: string }
            description: { type: string }
            token_set: { type: boolean, description: "a git token is stored; the token itself is never returned" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            last_run: { $ref: "#/components/schemas/ProjectLastRun" }
            intake: { $ref: "#/components/schemas/ProjectIntake" }
            instructions: { type: string, description: "DESIGN 5.18: the operator's standing instructions rendered into every visit's task on the project; empty when none" }
            max_cost_usd_per_day: { type: number, description: "DESIGN 5.19: the project's UTC-day cap in USD; absent when none" }
            max_cost_usd_per_month: { type: number, description: "DESIGN 5.19: the project's UTC-month cap in USD; absent when none" }
            spend: { $ref: "#/components/schemas/ProjectSpend" }
    ProjectInput:
      type: object
      description: The read-only Project fields are accepted and ignored, so a client can PUT back what it fetched.
      required: [name, repo_url]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        repo_url: { type: string, description: "the https clone URL, without credentials" }
        provider: { type: string, enum: [gitlab, github, ""], description: "empty: github for github.com, gitlab for any other host" }
        default_branch: { type: string, default: main }
        sandbox_network: { type: boolean, default: false }
        description: { type: string, maxLength: 1024 }
        token: { type: string, description: "write-only: required on create; on update, absent or empty keeps the stored token" }
        instructions: { type: string, maxLength: 8192, description: "DESIGN 5.18 rule 1: at most 8192 bytes, no control characters other than newline and tab; absent on update clears it" }
        max_cost_usd_per_day: { type: [number, "null"], exclusiveMinimum: 0, maximum: 1000000, description: "DESIGN 5.19 rule 1; absent or null clears the cap" }
        max_cost_usd_per_month: { type: [number, "null"], exclusiveMinimum: 0, maximum: 1000000, description: "DESIGN 5.19 rule 1; absent or null clears the cap" }
        intake: { $ref: "#/components/schemas/ProjectIntakeInput" }
        spend: {}
        id: {}
        token_set: {}
        created_at: {}
        updated_at: {}
        last_run: {}
    ProjectSpend:
      type: object
      description: "DESIGN 5.19 rule 7: what the project's runs spent in the current UTC day and month, in USD, whatever their status."
      required: [day_usd, month_usd]
      properties:
        day_usd: { type: number }
        month_usd: { type: number }
        day_until: { type: string, format: date-time, description: "when the day window ends" }
        month_until: { type: string, format: date-time, description: "when the month window ends" }
    ProjectIntakeInput:
      type: object
      description: |
        DESIGN 5.23 rule 1: the project's issue intake settings. Absent on
        update keeps the stored settings. 422 details: `intake.label` (1 to 50 characters
        without spaces or commas), `intake.workflow_id` (required when enabled; a live operator
        workflow that uses a project and whose input accepts `{"task": string}`),
        `intake.enabled` (a daily or monthly budget cap must be set first).
      properties:
        enabled: { type: boolean, default: false, description: "open issues carrying the label become runs" }
        label: { type: string, default: yuno, minLength: 1, maxLength: 50, description: "the intake label (1 to 50 bytes, no spaces or commas, not None or Any); the platform moves it to <label>:running, <label>:done or <label>:failed" }
        workflow_id: { type: string, description: "the workflow each issue runs; its input receives the issue as task" }
    ProjectIntake:
      allOf:
        - $ref: "#/components/schemas/ProjectIntakeInput"
        - type: object
          description: "DESIGN 5.23 rule 1: the settings plus what the last poll did."
          required: [enabled, label]
          properties:
            workflow_name: { type: string, description: "the workflow's name as the API joined it; absent when none or deleted" }
            polled_at: { type: string, format: date-time, description: "when the intake last polled the project; absent before the first poll" }
            last_error: { type: string, description: "why the last poll took nothing or could not update an issue: the budget text, a provider's or the trigger's message; absent when the last poll was clean" }
    IntakePollResult:
      type: object
      description: "DESIGN 5.23 rule 2: what one intake pass over a project did."
      required: [taken, closed]
      properties:
        taken: { type: integer, description: "runs created for issues in this pass" }
        closed: { type: integer, description: "finished issue runs whose outcome was posted on their issue in this pass" }
        error: { type: string, description: "the first provider or trigger error of the pass; absent when clean" }
    ProjectFact:
      type: object
      description: "DESIGN 5.18 rule 2: a note an agent saved for the project; any agent of a run on the project reads and writes them."
      required: [id, project_id, key, value, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        key: { type: string, maxLength: 200 }
        value: { type: string, maxLength: 2048 }
        agent_id: { type: string, description: "the agent that saved it; absent once that agent is deleted" }
        agent_name: { type: string }
        source_run_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    MergeRequest:
      type: object
      description: "DESIGN 5.20 rule 1: a merge request (GitLab) or pull request (GitHub) the platform opened for a run; one per run."
      required: [id, project_id, run_id, provider, number, url, source_branch, target_branch, title, state, ci_status, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        run_id: { type: string }
        provider: { type: string, enum: [gitlab, github] }
        number: { type: integer, description: "the GitLab iid or the GitHub pull number" }
        url: { type: string }
        source_branch: { type: string }
        target_branch: { type: string }
        title: { type: string }
        state: { type: string, enum: [open, merged, closed] }
        ci_status: { type: string, enum: [none, pending, passed, failed] }
        head_sha: { type: string }
        unresolved_threads: { type: [integer, "null"], description: "null when the provider could not tell (a GitHub token without GraphQL access)" }
        last_sync_error: { type: string }
        synced_at: { type: string, format: date-time }
        reported_state: { type: string, enum: [merged, closed], description: "the final state already reported into the run's conversation" }
        merged_by: { type: string, description: "operator when merged through the platform" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, description: "when it was merged or closed" }
    RunRetry:
      type: object
      description: "DESIGN 5.21 rule 1: the body of a retry; limits, when given, replace the run's limits before the exhausted-limit check."
      properties:
        limits: { $ref: "#/components/schemas/Limits" }
    ProjectCheck:
      type: object
      required: [ok, message, checked_at]
      properties:
        ok: { type: boolean, description: the token was accepted and the repository found }
        message: { type: string, description: one sentence for the operator }
        default_branch: { type: string, description: the repository's default branch as the provider reports it }
        branch_exists: { type: boolean, description: the project's default branch exists on the repository }
        can_push: { type: boolean, description: the token can push to the project's default branch }
        checked_at: { type: string, format: date-time }
    ExecPolicy:
      type: object
      description: OpenClaw exec approvals policy for elevated (host) exec; sandboxed exec needs no approval.
      properties:
        security: { type: string, enum: [deny, allowlist, full] }
        ask: { type: string, enum: [off, on-miss, always] }
        ask_fallback: { type: string, enum: [deny, allowlist, full] }
        allowlist: { type: array, items: { type: string } }
    AgentInput:
      type: object
      required: [name, model]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        role: { type: string }
        system_prompt: { type: string }
        model: { type: string, description: "Anthropic model id, e.g. claude-opus-5-5" }
        effort: { type: string, enum: [low, medium, high, xhigh, max] }
        thinking: { type: string, enum: [off, minimal, low, medium, high, xhigh, adaptive, max] }
        max_tokens: { type: integer }
        tool_allowlist: { type: array, items: { type: string } }
        interaction_rules:
          type: object
          description: |
            Tool name to policy. Without a rule a side-effecting platform tool requires
            approval and every other tool runs automatically. require_approval applies to
            platform tools only; finish is always auto.
          additionalProperties: { type: string, enum: [auto, require_approval, blocked] }
        limits: { $ref: "#/components/schemas/Limits" }
        guardrails: { $ref: "#/components/schemas/Guardrails" }
        memory_policy: { $ref: "#/components/schemas/MemoryPolicy" }
        exec_policy: { $ref: "#/components/schemas/ExecPolicy" }
        skills: { type: array, items: { type: string }, description: "names of existing skills (422 skills[i] for an unknown one)" }
    Agent:
      allOf:
        - $ref: "#/components/schemas/AgentInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            channels:
              type: array
              readOnly: true
              items: { type: string, enum: [telegram] }
              description: The channels this agent answers now, from the channel bindings made on the Channels page. Ignored on create and update.
            id: { type: string }
            openclaw_agent_id: { type: string }
            materialized_hash: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AgentListItem:
      description: An agent as GET /api/agents lists it.
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [channels, activity]
          properties:
            channels:
              type: array
              items: { type: string, enum: [telegram] }
              description: The channels this agent answers now, from the channel bindings (telegram when it is bound); empty otherwise.
            activity:
              type: object
              description: This agent's node visits in flight, in runs that have not finished.
              required: [running, waiting_approval]
              properties:
                running: { type: integer, minimum: 0 }
                waiting_approval: { type: integer, minimum: 0 }
    AgentRuntime:
      type: object
      description: The agent as OpenClaw holds it after materialisation.
      required: [openclaw_agent_id, materialized, in_sync]
      properties:
        openclaw_agent_id: { type: string }
        materialized: { type: boolean }
        in_sync: { type: boolean, description: stored config hash equals the agent's current configuration }
        workspace: { type: string }
        config_entry: { type: object, description: agents.entries.<id> as returned by config.get }
        exec_policy: { type: object }
        files: { type: array, items: { type: string } }
    Tool:
      type: object
      required: [name, description, risk, hits, timeout_seconds, chat, source]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema: { type: object }
        risk: { type: string, enum: [read_only, computational, side_effecting] }
        hits: { type: string, enum: [none, postgres, local_service, external, openclaw] }
        timeout_seconds: { type: integer }
        max_attempts: { type: integer }
        untrusted_output: { type: boolean }
        chat: { type: boolean, description: "an agent may call it while chatting with a person, with its chat token instead of a run token (list_agents, list_workflows, delegate_task, run_status, memory_save, memory_recall); false for every other tool" }
        source: { type: string, enum: [platform, openclaw], description: platform tools are served over MCP; openclaw tools are the runtime's built-ins }
    RunCreate:
      type: object
      properties:
        workflow_id: { type: string }
        input: { type: object }
        agent_id: { type: string }
        task: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }
        model: { type: string, description: "OpenClaw model ref override for this run, e.g. scripted/scripted-1 (evals and tests)" }
        script_id: { type: string, description: "Script registered via /api/evals/scripts that the scripted provider replays for this run" }
        trigger: { type: string, enum: [manual, eval], default: manual, description: "Who starts the run: an operator, or the eval runner (eval runs can be filtered out of the run list); schedules and channels start their own runs" }
        project_id: { type: string, description: "The project the run works on (DESIGN 5.17 rule 4): required for a workflow whose definition has `project: true`, refused for one without it, optional for a quick run, whose one-node workflow then opts in. The engine clones the project into the first agent's run directory before its turn." }
        merge_request_id: { type: string, description: "DESIGN 5.22 rule 1: the open merge request record of the project whose source branch the run clones and pushes onto instead of opening a new request; optional, needs project_id (or a workflow that uses a project); 422 details on merge_request_id." }
    ScriptStep:
      type: object
      description: One scripted model response; exactly one of text or tool.
      properties:
        text: { type: string }
        tool:
          type: object
          required: [name, args]
          properties:
            name: { type: string, description: OpenClaw built-in or platform tool name as the model would call it }
            args: { type: object }
        usage:
          type: object
          properties:
            prompt: { type: integer }
            completion: { type: integer }
    ScriptRegistration:
      type: object
      required: [script_id, steps]
      properties:
        script_id: { type: string, pattern: "^[a-zA-Z0-9._-]{1,80}$" }
        steps: { type: array, items: { $ref: "#/components/schemas/ScriptStep" } }
    Run:
      type: object
      required: [id, workflow_id, workflow_version, trigger, status, input, state, limits, step_count, tool_call_count, cost_usd_micros, created_at]
      properties:
        id: { type: string }
        workflow_id: { type: string }
        workflow_version: { type: integer }
        trigger: { type: string, enum: [manual, schedule, channel, eval, issue], description: "issue: a run the issue intake created (DESIGN 5.23)" }
        trigger_ref: { type: string, description: "schedule: the occurrence fired, <schedule id>@<occurrence time, RFC 3339 UTC>; channel: conversation:<conversation id> for a run an agent delegated while chatting (absent when it had no conversation); eval: the case id; issue: <project id>#<issue number>" }
        status: { type: string, enum: [queued, running, waiting_approval, succeeded, failed, cancelled, timed_out] }
        input: { type: object }
        state: { type: object }
        limits: { $ref: "#/components/schemas/Limits" }
        current_node: { type: string }
        step_count: { type: integer }
        tool_call_count: { type: integer }
        attempt: { type: integer }
        cancel_requested: { type: boolean }
        failure_reason: { type: string }
        cost_usd_micros: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        cache_write_tokens: { type: integer }
        paused_total_ms: { type: integer }
        agent_names:
          type: array
          items: { type: string }
          description: "Agents the run's nodes ran, first appearance first; the list endpoint fills it."
        models:
          type: array
          items: { type: string }
          description: "Models the run's model calls used, first appearance first; the list endpoint fills it."
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reported_at: { type: string, format: date-time, description: "when a channel run's outcome was sent back into its conversation or (DESIGN 5.23 rule 5) an issue run's outcome was posted on its issue; absent otherwise" }
        toolchain: { type: string, enum: [go, node, python, default], description: "what the project checkout's manifest said when the engine cloned it (go.mod, package.json with a lockfile, uv.lock, requirements*.txt, pyproject.toml); absent for a run without a checkout" }
        project_id: { type: string, description: "the project the run works on; absent for a run without one" }
        project:
          allOf: [ { $ref: "#/components/schemas/ProjectSettings" } ]
          description: "the run's snapshot of its project's settings, taken when it was queued; never the token"
        retries: { type: integer, description: "DESIGN 5.21: how many times the operator retried the run from the step it stopped at" }
        merge_request:
          allOf: [ { $ref: "#/components/schemas/MergeRequest" } ]
          description: "DESIGN 5.20 rule 6: the request the run opened, or (DESIGN 5.22 rule 1) the one it names; absent when none"
        merge_request_id: { type: string, description: "DESIGN 5.22 rule 1: the merge request record the run updates (its branch was cloned); absent for a run that opens its own or none" }
        checkout_sha: { type: string, description: "DESIGN 5.22 rule 2: the commit the run's checkout was cloned at, moved to each commit the run pushed; absent for a run without a checkout" }
    RunNode:
      type: object
      required: [id, run_id, node_id, visit, iteration, status]
      properties:
        id: { type: string }
        run_id: { type: string }
        node_id: { type: string }
        agent_id: { type: string }
        visit: { type: integer }
        iteration: { type: integer }
        question_id: { type: string, description: "set on a continuation visit: the question (an approval of kind question) whose answer this visit of the step continues with (DESIGN 5.24 rule 5); such a visit does not count toward max_loop_visits" }
        branch_id: { type: string, description: "set on a visit made inside a branch of a fork: the RunBranch it belongs to (DESIGN 5.26 rule 4)" }
        status: { type: string, enum: [pending, running, waiting_approval, succeeded, failed, skipped] }
        messages: { type: array, items: { type: object }, description: "transcript entries mirrored from OpenClaw, never reasoning" }
        output: { description: "the node's validated result; for a fork or join visit, {\"branches\": [<heads in edge order>]} (DESIGN 5.26 rules 3 and 5)" }
        failure_reason: { type: string }
        session_key: { type: string }
        openclaw_run_id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ModelCall:
      type: object
      required: [id, run_id, run_node_id, provider, model, input_tokens, output_tokens, cost_usd_micros, duration_ms, attempt, started_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        run_node_id: { type: string }
        provider: { type: string }
        model: { type: string }
        request_id: { type: string }
        stop_reason: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        cache_write_tokens: { type: integer }
        cost_usd_micros: { type: integer }
        duration_ms: { type: integer }
        attempt: { type: integer }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ToolCall:
      type: object
      required: [id, run_id, run_node_id, tool_use_id, tool_name, input, is_error, status, attempt, duration_ms]
      properties:
        id: { type: string }
        run_id: { type: string, description: "empty for a call made while chatting (chat token)" }
        run_node_id: { type: string, description: "empty for a call made while chatting (chat token)" }
        conversation_id: { type: string, description: "set on a call made while chatting: the agent's most recent conversation; absent when it had none, and on run calls" }
        model_call_id: { type: string }
        tool_use_id: { type: string }
        tool_name: { type: string }
        input: {}
        output: {}
        is_error: { type: boolean }
        status: { type: string, enum: [executed, awaiting_approval, approved, rejected, blocked, expired, failed] }
        idempotency_key: { type: string }
        attempt: { type: integer }
        duration_ms: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    Span:
      type: object
      required: [id, run_id, kind, name, started_at, attrs]
      properties:
        id: { type: string }
        run_id: { type: string }
        parent_id: { type: string }
        kind: { type: string, enum: [run, node, model_call, tool_call, approval_wait] }
        name: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        attrs: { type: object }
    AgentMessage:
      type: object
      required: [id, run_id, from_node, to_node, payload, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        from_node: { type: string }
        to_node: { type: string }
        payload: {}
        created_at: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, run_id, run_node_id, kind, node_id, message, status, requested_at, expires_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        run_node_id: { type: string }
        tool_call_id: { type: string }
        kind: { type: string, enum: [exec, tool, node, question], description: "question: a run asks the operator something and waits for the answer (DESIGN 5.24). It is answered through /answer, or declined through /reject; approved means answered." }
        node_id: { type: string }
        message: { type: string, description: "the gated command or call, the node's message, or the question's text" }
        options: { type: array, items: { type: string }, description: "question only: the answers the agent suggested, 2 to 5; an answer need not be one of them" }
        answer: { type: string, description: "question only: the operator's answer, set when the status is approved" }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        external_id: { type: string, description: OpenClaw approval id when the gateway raised it }
        requested_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        decided_by: { type: string }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
        conversation_id: { type: string, description: "set, with run_id and run_node_id empty, for an exec approval raised in a conversation" }
        reported_at: { type: string, format: date-time, description: "when the approval was announced in the conversation that delegated its run; absent otherwise" }
    Trace:
      type: object
      required: [run, nodes, model_calls, tool_calls, spans, agent_messages, approvals]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        nodes: { type: array, items: { $ref: "#/components/schemas/RunNode" } }
        model_calls: { type: array, items: { $ref: "#/components/schemas/ModelCall" } }
        tool_calls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
        spans: { type: array, items: { $ref: "#/components/schemas/Span" } }
        agent_messages: { type: array, items: { $ref: "#/components/schemas/AgentMessage" } }
        approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        side_effects: { type: array, items: { $ref: "#/components/schemas/SideEffect" } }
        branches: { type: array, items: { $ref: "#/components/schemas/RunBranch" }, description: "one row per branch of every fork visit of the run, by started_at then id (DESIGN 5.26 rule 12); empty for a run without forks" }
    RunBranch:
      type: object
      description: "One branch of a fork visit: the part of the run that started at one outgoing edge of the fork and runs at the same time as its siblings until the join (DESIGN 5.26). The rows of one fork visit are created in the fork's edge order with started_at a microsecond apart, so the started_at order is the edge order."
      required: [id, run_id, fork_visit_id, fork_id, head, status, current_node, started_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        fork_visit_id: { type: string, description: "the RunNode of the fork this branch belongs to" }
        fork_id: { type: string, description: "the fork node's id" }
        head: { type: string, description: "the branch's first node, the fork edge's target; names the branch" }
        status: { type: string, enum: [running, waiting_approval, succeeded, failed, cancelled], description: "waiting_approval: the branch's newest visit parked on a question" }
        current_node: { type: string, description: "where the branch is: the node its next or current visit runs" }
        failure_reason: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    SideEffect:
      type: object
      description: One executed side effect, keyed by its idempotency key; a repeated call replays the stored result.
      required: [idempotency_key, tool_name, run_id, tool_call_id, created_at]
      properties:
        idempotency_key: { type: string }
        tool_name: { type: string }
        run_id: { type: string }
        tool_call_id: { type: string, description: the tool call that executed it }
        result: {}
        created_at: { type: string, format: date-time }
    ApprovalItem:
      allOf:
        - $ref: "#/components/schemas/Approval"
        - type: object
          properties:
            tool_call: { $ref: "#/components/schemas/ToolCall" }
            run_status: { type: string, enum: [queued, running, waiting_approval, succeeded, failed, cancelled, timed_out], description: "the status of the approval's run, so a tool approval on a run that has already ended can say that approving still executes the call; absent for an approval raised in a conversation" }
    ApprovalDecision:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 2000 }
        always: { type: boolean, description: exec approvals only }
    RejectDecision:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 2000 }
    AnswerBody:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 4096, description: "the operator's answer, 1 to 4096 bytes after trimming; need not be one of the question's options" }
    Artifact:
      type: object
      description: One file a run delivered (DESIGN 5.25), the newest version at its path.
      required: [id, run_id, node_id, visit, path, size, sha256, content_type, generated, created_at, updated_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        node_id: { type: string, description: the step whose visit last collected this version }
        visit: { type: integer }
        path: { type: string, description: "relative to runs/<run id>/out/, at most 512 bytes" }
        size: { type: integer, format: int64, description: bytes }
        sha256: { type: string }
        content_type: { type: string, description: "sniffed, with text kinds by extension (text/markdown, application/json, text/csv, text/x-patch, text/yaml)" }
        generated: { type: boolean, description: "true for the platform's own diff.patch of a project run" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: when this version was collected }
    WorkflowNode:
      type: object
      properties:
        id: { type: string, description: "^[a-z0-9_]{1,40}$, unique in the workflow" }
        kind: { type: string, description: "start | agent | approval | fork | join | end (fork and join: DESIGN 5.26)" }
        join: { type: string, description: "fork nodes: the join node every branch ends at (DESIGN 5.26 rule 1)" }
        checkout: { type: string, description: "join nodes of a project workflow: the head of the branch whose checkout continues past the join; without it no branch's checkout does (DESIGN 5.26 rule 10)" }
        agent_id: { type: string }
        agent_name: { type: string, description: templates only; resolved to agent_id on instantiate }
        task: { type: string, description: "Go text/template over {input, state}, e.g. {{.input.task}}" }
        output_schema: { type: object }
        input_from: { type: array, items: { type: string } }
        message: { type: string, description: approval nodes }
        on_reject: { type: string, description: approval nodes }
        on_failure: { type: string }
    WorkflowEdge:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        when:
          type: object
          description: "{path, op, value} with op in eq, neq, in, exists, gt, lt over the run state by JSON pointer, or {all: [...]} / {any: [...]}"
    WorkflowDefinition:
      type: object
      description: The graph (DESIGN 5.6). Keys the platform does not know, such as the builder's layout, are kept.
      properties:
        input_schema: { type: object }
        state_schema: { type: object }
        nodes: { type: array, items: { $ref: "#/components/schemas/WorkflowNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/WorkflowEdge" } }
        limits: { $ref: "#/components/schemas/Limits" }
        project: { type: boolean, description: "runs of this workflow work on the project repository when one is configured: the engine clones it into the first agent's run directory, later agents receive the checkout, and open_merge_request can propose it" }
    WorkflowInput:
      type: object
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        definition: { $ref: "#/components/schemas/WorkflowDefinition" }
    Workflow:
      type: object
      required: [id, name, description, definition, version, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        definition: { $ref: "#/components/schemas/WorkflowDefinition" }
        version: { type: integer }
        template_key: { type: string, description: set on template rows and the hidden quick-run workflows }
        from_template: { type: string, description: "the key of the template the workflow was instantiated from; absent for workflows built from scratch" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkflowValidateRequest:
      type: object
      required: [definition]
      properties:
        definition: { $ref: "#/components/schemas/WorkflowDefinition" }
    WorkflowValidation:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
    WorkflowTemplate:
      type: object
      required: [key, name, description, definition]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        definition: { $ref: "#/components/schemas/WorkflowDefinition" }
    InstantiateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120, description: defaults to the template's name }
    ChannelBindingInput:
      type: object
      required: [agent_id]
      additionalProperties: false
      properties:
        agent_id: { type: string }
    ChannelBinding:
      type: object
      required: [agent_id, agent_name, created_at]
      properties:
        agent_id: { type: string }
        agent_name: { type: string }
        created_at: { type: string, format: date-time }
    Channels:
      type: object
      required: [telegram]
      properties:
        telegram:
          type: object
          required: [enabled, mode, allowed_user_ids, binding]
          properties:
            enabled: { type: boolean, description: the gateway runs the Telegram channel (TELEGRAM_MODE polling or webhook) }
            mode: { type: string, enum: [polling, webhook, off] }
            bot_username: { type: string, description: as the gateway reports it; absent while unknown }
            allowed_user_ids: { type: array, items: { type: integer }, description: Telegram user ids that may message the bot }
            binding:
              description: the agent that answers Telegram; null while none is bound and the channel is closed
              oneOf:
                - $ref: "#/components/schemas/ChannelBinding"
                - type: "null"
    Conversation:
      type: object
      required: [id, channel, external_chat_id, agent_id, agent_name, session_key, created_at, message_count]
      properties:
        id: { type: string }
        channel: { type: string, enum: [telegram] }
        external_chat_id: { type: string, description: the Telegram user id of the direct chat }
        agent_id: { type: string, description: empty when the agent was deleted }
        agent_name: { type: string }
        session_key: { type: string, description: the OpenClaw session the conversation mirrors }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
        last_message_at: { type: string, format: date-time }
        message_count: { type: integer }
    ConversationMessage:
      type: object
      required: [id, conversation_id, direction, external_message_id, text, run_id, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        direction: { type: string, enum: [in, out], description: "in: what the person sent; out: what the agent answered" }
        external_message_id: { type: string }
        text: { type: string }
        usage: { type: [object, "null"], description: "the model usage of an answer (out), null otherwise" }
        run_id: { type: [string, "null"], description: "the run a [platform] report the engine injected is about (direction in); null for everything the person and the agent wrote, since conversation turns are not runs" }
        created_at: { type: string, format: date-time }
