# The api shares the openclaw container's network namespace, so its port 8080 is
# addressed as openclaw:8080. Upstreams are resolved through Docker's DNS at request
# time (resolver + variables), so a recreated gateway container with a new address is
# followed without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $api http://openclaw:8080;
    set $gateway http://openclaw:18789;
    set $deploytarget http://deploytarget:8091;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: no buffering, long timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }
    location = /openapi.yaml { proxy_pass $api; }
    location = /healthz      { proxy_pass $api; }
    location = /readyz       { proxy_pass $api; }

    # OpenClaw's Telegram webhook route lives on the gateway port (DESIGN 5.8 rule 1).
    location = /telegram-webhook {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        client_max_body_size 64k;
    }

    # Deployed releases from the local deploy target.
    location /deploy/ {
        rewrite ^/deploy/(.*)$ /$1 break;
        proxy_pass $deploytarget;
        proxy_set_header Host $host;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The listener the public tunnel points at (make tunnel): only the Telegram webhook
# route, so exposing it never exposes the API or the UI.
server {
    listen 8081;
    server_name _;
    set $gateway http://openclaw:18789;

    location = /telegram-webhook {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        client_max_body_size 64k;
    }
    location / { return 404; }
}
