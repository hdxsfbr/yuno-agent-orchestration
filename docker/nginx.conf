server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The api shares the openclaw container's network namespace, so its port 8080 is
    # addressed as openclaw:8080.
    location /api/ {
        proxy_pass http://openclaw:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: no buffering, long timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }
    location = /openapi.yaml { proxy_pass http://openclaw:8080; }
    location = /healthz      { proxy_pass http://openclaw:8080; }
    location = /readyz       { proxy_pass http://openclaw:8080; }

    # OpenClaw's Telegram webhook route lives on the gateway port (DESIGN 5.8 rule 1).
    location = /telegram-webhook {
        proxy_pass http://openclaw:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        client_max_body_size 64k;
    }

    # Deployed releases from the local deploy target.
    location /deploy/ {
        proxy_pass http://deploytarget:8091/;
        proxy_set_header Host $host;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
