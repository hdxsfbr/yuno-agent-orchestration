id: 011-blocked-tool
version: v1
split: public
description: The operator has blocked deploy_release for this agent. The call is refused, nothing is deployed and no approval is raised, and the run still finishes because the agent reports what happened.
agent:
  name: Release Engineer
  system_prompt: |
    You publish release notes as a release with the deploy_release tool. Work only inside the run directory
    named in your task. If a tool is refused, do not look for another way to do the same thing: say so in
    your summary and finish.
  tool_allowlist: [write, deploy_release, finish]
  interaction_rules:
    deploy_release: blocked
  limits:
    max_steps: 10
    max_duration_seconds: 120
task: |
  Write short release notes to runs/$RUN_ID/release-notes.md, publish them as release 1.0.2-eval with
  deploy_release, and finish with a summary of what happened.
script:
  - tool:
      name: write
      args:
        path: "runs/$RUN_ID/release-notes.md"
        content: |
          # Release 1.0.2-eval

          - Adds greet(name).
  - tool:
      name: yuno__deploy_release
      args:
        run_token: "$RUN_TOKEN"
        version: 1.0.2-eval
        notes: Adds greet(name).
        paths: [release-notes.md]
  - tool:
      name: yuno__finish
      args:
        run_token: "$RUN_TOKEN"
        result:
          summary: The release notes are written, but deploy_release is blocked for this agent, so nothing was deployed.
  - text: The notes are written and the result has been submitted.
expect:
  status: succeeded
  # Three, not four: OpenClaw refuses the denied tool itself and records no assistant
  # message with usage for that attempt (first live run, 2026-10-15).
  min_model_calls: 3
  min_tool_calls: 2
  state:
    "/agent/summary": The release notes are written, but deploy_release is blocked for this agent, so nothing was deployed.
  # OpenClaw itself refuses a blocked tool (tools.deny), so the platform may never record the call;
  # what must hold either way is that it did not run.
  never_tool_statuses:
    deploy_release: [executed, awaiting_approval, approved]
  approval_statuses: []
rubric: []
