id: 014-tool-approval-gate
version: v1
split: private
description: deploy_release requires approval. The call waits at the gate, a human approves it, and the release is published in the same turn, after the approval and not before.
agent:
  name: Release Engineer
  system_prompt: |
    You publish release notes as a release with the deploy_release tool, exactly once. Work only inside
    the run directory named in your task. If the tool answers that the deploy was rejected or is pending
    approval, report that and stop. When you are done, call yuno__finish with a summary.
  tool_allowlist: [write, deploy_release, finish]
  interaction_rules:
    deploy_release: require_approval
  limits:
    max_steps: 10
    max_duration_seconds: 120
task: |
  Write short release notes to runs/$RUN_ID/release-notes.md, publish them as release 1.0.3-eval with
  deploy_release, and finish with a summary of the release.
script:
  - tool:
      name: write
      args:
        path: "runs/$RUN_ID/release-notes.md"
        content: |
          # Release 1.0.3-eval

          - Adds greet(name).
  - tool:
      name: yuno__deploy_release
      args:
        run_token: "$RUN_TOKEN"
        version: 1.0.3-eval
        notes: Adds greet(name).
        paths: [release-notes.md]
  - tool:
      name: yuno__finish
      args:
        run_token: "$RUN_TOKEN"
        result:
          summary: Published release 1.0.3-eval with its release notes.
  - text: The release is published and the result has been submitted.
actions:
  approvals:
    - { decision: approve, reason: The release notes are what was asked for. }
expect:
  status: succeeded
  min_model_calls: 4
  min_tool_calls: 3
  state:
    "/agent/summary": Published release 1.0.3-eval with its release notes.
  tool_statuses:
    deploy_release: [executed]
  approval_statuses: [approved]
rubric: []
